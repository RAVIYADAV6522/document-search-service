<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Search</title>
  <meta name="description" content="Search 10,000 documents with PostgreSQL full-text search or a from-scratch cosine-similarity ranker.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><circle cx="14" cy="14" r="6"/><path d="M19 19l6 6"/></svg>
        Document Search
      </a>
      <a class="toplink" href="https://github.com/RAVIYADAV6522/document-search-service">GitHub</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <form class="searchbar" id="search-form" role="search">
        <label class="visually-hidden" for="q">Search documents</label>
        <svg class="searchbar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" name="q" type="search" autocomplete="off" maxlength="500"
               placeholder="Search documents" autofocus>
        <button type="submit">Search</button>
      </form>

      <div class="controls">
        <div class="segmented" role="radiogroup" aria-label="Search engine" id="engine">
          <button type="button" role="radio" data-engine="sql"
                  title="PostgreSQL full-text search: matches every word and understands word forms">SQL</button>
          <button type="button" role="radio" data-engine="cosine"
                  title="Cosine similarity ranker written from scratch: matches any word exactly">Cosine</button>
          <button type="button" role="radio" data-engine="compare"
                  title="Run both engines side by side">Compare</button>
        </div>
        <p class="library-meta" id="library-meta"></p>
      </div>
    </section>

    <div class="layout">
      <section class="results-area" aria-live="polite">
        <div class="status" id="status"></div>
        <div id="results"></div>
        <nav class="pager" id="pager" hidden>
          <button type="button" id="prev">← Previous</button>
          <span id="page-info"></span>
          <button type="button" id="next">Next →</button>
        </nav>
      </section>

      <aside class="sidebar">
        <h2>Tags</h2>
        <ul class="tag-list" id="tag-list"></ul>
      </aside>
    </div>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <h3 class="card-title"></h3>
        <span class="score" title="Relevance score"></span>
      </div>
      <p class="card-body"></p>
      <div class="card-foot">
        <div class="card-meta">
          <span class="owner"></span>
          <span aria-hidden="true">·</span>
          <time class="date"></time>
        </div>
        <div class="card-tags"></div>
      </div>
    </article>
  </template>
</body>
</html>
